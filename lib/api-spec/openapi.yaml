openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Urban Pair internal operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: products
  - name: suppliers
  - name: orders
  - name: imports
  - name: shipments
  - name: sales
  - name: finance
  - name: alerts
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard metrics and series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Product deleted
  /product-sources/preview:
    post:
      operationId: previewProductSource
      tags: [products]
      summary: Preview a public product URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSourcePreviewInput"
      responses:
        "200":
          description: Product URL preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSourcePreview"
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Supplier deleted
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List purchase orders
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrder"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List imports
      responses:
        "200":
          description: Import list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRecord"
    post:
      operationId: createImport
      tags: [imports]
      summary: Create an import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRecord"
  /imports/{id}/complete:
    post:
      operationId: completeImport
      tags: [imports]
      summary: Add an import to inventory once
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Completed import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRecord"
  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List shipments
      responses:
        "200":
          description: Shipment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
    post:
      operationId: createShipment
      tags: [shipments]
      summary: Create a shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Record a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
  /expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: List expenses
      responses:
        "200":
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /alerts/{id}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark an alert as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace settings
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Product:
      type: object
      required: [id, name, sku, category, platform, purchasePriceCny, costBrl, weightGrams, currentStock, inTransit, sellingPriceBrl, marginPercent, profitBrl, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: string }
        imageUrl: { type: ["string", "null"] }
        category: { type: string }
        supplierName: { type: ["string", "null"] }
        platform: { type: string }
        sourceUrl: { type: ["string", "null"] }
        purchasePriceCny: { type: number }
        costBrl: { type: number }
        weightGrams: { type: number }
        currentStock: { type: integer }
        reservedStock: { type: integer }
        inTransit: { type: integer }
        minimumStock: { type: integer }
        sellingPriceBrl: { type: number }
        marginPercent: { type: number }
        profitBrl: { type: number }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, sku, category, platform, purchasePriceCny, sellingPriceBrl]
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string, minLength: 1 }
        imageUrl: { type: string }
        category: { type: string, minLength: 1 }
        supplierId: { type: ["integer", "null"] }
        platform: { type: string }
        sourceUrl: { type: string }
        purchasePriceCny: { type: number, minimum: 0 }
        domesticShippingBrl: { type: number, minimum: 0, default: 0 }
        weightGrams: { type: number, minimum: 0, default: 0 }
        minimumStock: { type: integer, minimum: 0, default: 0 }
        sellingPriceBrl: { type: number, minimum: 0 }
        description: { type: string }
        notes: { type: string }
    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
    ProductList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ProductSourcePreviewInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ProductSourcePreview:
      type: object
      required: [url, platform, importStatus]
      properties:
        url: { type: string }
        platform: { type: string }
        externalProductId: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        price: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        seller: { type: ["string", "null"] }
        importStatus: { type: string }
        message: { type: ["string", "null"] }
    Supplier:
      type: object
      required: [id, name, platform, status, productCount, orderCount, totalPurchasedBrl]
      properties:
        id: { type: integer }
        name: { type: string }
        contact: { type: ["string", "null"] }
        platform: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        yupooCatalogUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        rating: { type: ["number", "null"] }
        status: { type: string }
        productCount: { type: integer }
        orderCount: { type: integer }
        totalPurchasedBrl: { type: number }
    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        contact: { type: string }
        platform: { type: string }
        username: { type: string }
        url: { type: string }
        yupooCatalogUrl: { type: string }
        notes: { type: string }
        rating: { type: number, minimum: 0, maximum: 5 }
        status: { type: string, default: Active }
    SupplierUpdate:
      allOf:
        - $ref: "#/components/schemas/SupplierInput"
    PurchaseOrder:
      type: object
      required: [id, orderCode, supplierName, platform, status, currency, totalCny, orderedAt]
      properties:
        id: { type: integer }
        orderCode: { type: string }
        supplierName: { type: ["string", "null"] }
        platform: { type: string }
        cssbuyOrderId: { type: ["string", "null"] }
        status: { type: string }
        currency: { type: string }
        totalCny: { type: number }
        itemCount: { type: integer }
        orderedAt: { type: string, format: date-time }
        notes: { type: ["string", "null"] }
    PurchaseOrderInput:
      type: object
      required: [orderCode, platform]
      properties:
        orderCode: { type: string, minLength: 1 }
        supplierId: { type: ["integer", "null"] }
        platform: { type: string }
        cssbuyOrderId: { type: string }
        status: { type: string, default: Draft }
        currency: { type: string, default: CNY }
        totalCny: { type: number, minimum: 0, default: 0 }
        notes: { type: string }
    ImportRecord:
      type: object
      required: [id, importCode, status, totalInvestmentBrl, potentialRevenueBrl, potentialProfitBrl, createdAt]
      properties:
        id: { type: integer }
        importCode: { type: string }
        supplierName: { type: ["string", "null"] }
        status: { type: string }
        quantity: { type: integer }
        productCostBrl: { type: number }
        domesticShippingBrl: { type: number }
        cssbuyFeesBrl: { type: number }
        internationalShippingBrl: { type: number }
        insuranceBrl: { type: number }
        taxesBrl: { type: number }
        packagingBrl: { type: number }
        otherCostsBrl: { type: number }
        totalInvestmentBrl: { type: number }
        potentialRevenueBrl: { type: number }
        potentialProfitBrl: { type: number }
        createdAt: { type: string, format: date-time }
        notes: { type: ["string", "null"] }
    ImportInput:
      type: object
      required: [importCode]
      properties:
        importCode: { type: string, minLength: 1 }
        supplierId: { type: ["integer", "null"] }
        status: { type: string, default: Research }
        quantity: { type: integer, minimum: 0, default: 0 }
        productCostBrl: { type: number, minimum: 0, default: 0 }
        domesticShippingBrl: { type: number, minimum: 0, default: 0 }
        cssbuyFeesBrl: { type: number, minimum: 0, default: 0 }
        internationalShippingBrl: { type: number, minimum: 0, default: 0 }
        insuranceBrl: { type: number, minimum: 0, default: 0 }
        taxesBrl: { type: number, minimum: 0, default: 0 }
        packagingBrl: { type: number, minimum: 0, default: 0 }
        otherCostsBrl: { type: number, minimum: 0, default: 0 }
        potentialRevenueBrl: { type: number, minimum: 0, default: 0 }
        notes: { type: string }
    Shipment:
      type: object
      required: [id, shipmentCode, status, weightGrams, shippingCostBrl, createdAt]
      properties:
        id: { type: integer }
        shipmentCode: { type: string }
        importId: { type: ["integer", "null"] }
        cssbuyParcelId: { type: ["string", "null"] }
        trackingNumber: { type: ["string", "null"] }
        carrier: { type: ["string", "null"] }
        shippingMethod: { type: ["string", "null"] }
        origin: { type: ["string", "null"] }
        destination: { type: ["string", "null"] }
        weightGrams: { type: number }
        shippingCostBrl: { type: number }
        insuranceBrl: { type: number }
        status: { type: string }
        eta: { type: ["string", "null"], format: date }
        lastTrackingUpdate: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ShipmentInput:
      type: object
      required: [shipmentCode]
      properties:
        shipmentCode: { type: string, minLength: 1 }
        importId: { type: ["integer", "null"] }
        cssbuyParcelId: { type: string }
        trackingNumber: { type: string }
        carrier: { type: string }
        shippingMethod: { type: string }
        origin: { type: string }
        destination: { type: string }
        weightGrams: { type: number, minimum: 0, default: 0 }
        shippingCostBrl: { type: number, minimum: 0, default: 0 }
        insuranceBrl: { type: number, minimum: 0, default: 0 }
        status: { type: string, default: Preparing }
        eta: { type: string, format: date }
    Sale:
      type: object
      required: [id, saleCode, productName, quantity, sellingPriceBrl, revenueBrl, productCostBrl, realizedProfitBrl, soldAt]
      properties:
        id: { type: integer }
        saleCode: { type: string }
        productId: { type: ["integer", "null"] }
        productName: { type: ["string", "null"] }
        quantity: { type: integer }
        sellingPriceBrl: { type: number }
        discountBrl: { type: number }
        revenueBrl: { type: number }
        productCostBrl: { type: number }
        logisticsCostBrl: { type: number }
        realizedProfitBrl: { type: number }
        paymentMethod: { type: ["string", "null"] }
        soldAt: { type: string, format: date-time }
    SaleInput:
      type: object
      required: [saleCode, quantity, sellingPriceBrl]
      properties:
        saleCode: { type: string, minLength: 1 }
        productId: { type: ["integer", "null"] }
        quantity: { type: integer, minimum: 1 }
        sellingPriceBrl: { type: number, minimum: 0 }
        discountBrl: { type: number, minimum: 0, default: 0 }
        logisticsCostBrl: { type: number, minimum: 0, default: 0 }
        paymentMethod: { type: string }
        notes: { type: string }
    Expense:
      type: object
      required: [id, category, amountBrl, spentAt]
      properties:
        id: { type: integer }
        category: { type: string }
        amountBrl: { type: number }
        description: { type: ["string", "null"] }
        spentAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [category, amountBrl]
      properties:
        category: { type: string, minLength: 1 }
        amountBrl: { type: number, minimum: 0 }
        description: { type: string }
        spentAt: { type: string, format: date-time }
    Alert:
      type: object
      required: [id, type, title, message, isRead, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    Activity:
      type: object
      required: [id, action, entity, description, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        entity: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    SeriesPoint:
      type: object
      required: [label, revenue, cost, profit]
      properties:
        label: { type: string }
        revenue: { type: number }
        cost: { type: number }
        profit: { type: number }
    CategoryPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    DashboardSummary:
      type: object
      required: [totalInvested, inventoryValue, inventoryCost, inTransitValue, potentialRevenue, potentialProfit, currentRevenue, realizedProfit, logisticsCost, lowStock, activeShipments, products, suppliers, orders, revenueSeries, categorySeries]
      properties:
        totalInvested: { type: number }
        inventoryValue: { type: number }
        inventoryCost: { type: number }
        inTransitValue: { type: number }
        potentialRevenue: { type: number }
        potentialProfit: { type: number }
        currentRevenue: { type: number }
        realizedProfit: { type: number }
        logisticsCost: { type: number }
        lowStock: { type: integer }
        activeShipments: { type: integer }
        products: { type: integer }
        suppliers: { type: integer }
        orders: { type: integer }
        revenueSeries:
          type: array
          items: { $ref: "#/components/schemas/SeriesPoint" }
        categorySeries:
          type: array
          items: { $ref: "#/components/schemas/CategoryPoint" }
    Settings:
      type: object
      required: [businessName, currency, timezone, theme]
      properties:
        businessName: { type: string }
        currency: { type: string }
        timezone: { type: string }
        theme: { type: string }
        defaultCountry: { type: string }
    SettingsUpdate:
      type: object
      properties:
        businessName: { type: string }
        currency: { type: string }
        timezone: { type: string }
        theme: { type: string }
        defaultCountry: { type: string }

